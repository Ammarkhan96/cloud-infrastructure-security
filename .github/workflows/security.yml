name: Terraform DevSecOps Pipeline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  # =========================================================
  # TERRAFORM SECURITY SCAN
  # =========================================================

  security:
    name: Terraform Security Scan
    runs-on: ubuntu-latest

    steps:

      # -------------------------------------------------------
      # Checkout Repository
      # -------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # -------------------------------------------------------
      # Setup Terraform
      # -------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8


      # -------------------------------------------------------
      # Terraform Format Check
      # -------------------------------------------------------

      - name: Terraform Format
        run: terraform fmt -check -recursive


      # -------------------------------------------------------
      # Terraform Init
      # -------------------------------------------------------

      - name: Terraform Init
        run: terraform init -backend=false


      # -------------------------------------------------------
      # Terraform Validate
      # -------------------------------------------------------

      - name: Terraform Validate
        run: terraform validate


      # -------------------------------------------------------
      # Checkov Security Scan
      # -------------------------------------------------------

      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          quiet: false
          soft_fail: true


  # =========================================================
  # TERRAFORM PLAN
  # =========================================================

  plan:
    name: Terraform Plan
    needs: security

    # Plan only runs after a push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      # -------------------------------------------------------
      # Checkout Repository
      # -------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # -------------------------------------------------------
      # Setup Terraform
      # -------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8


      # -------------------------------------------------------
      # Terraform Init
      # -------------------------------------------------------

      - name: Terraform Init
        run: terraform init -backend=false


      # -------------------------------------------------------
      # Terraform Plan
      # -------------------------------------------------------

      - name: Terraform Plan
        run: terraform plan